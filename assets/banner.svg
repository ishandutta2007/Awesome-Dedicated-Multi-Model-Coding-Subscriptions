<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #cbd5e1;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes streamFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .pulse-orb {
      animation: pulseGlow 6s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .floating-card-1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatPill 6s ease-in-out infinite 1.5s;
    }
    .stream-line {
      stroke-dasharray: 20, 15;
      animation: streamFlow 12s linear infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Background Dynamic Mesh & Glowing Orbs -->
  <g class="pulse-orb" opacity="0.4">
    <circle cx="200" cy="80" r="130" fill="url(#glowGrad)" filter="url(#blurFilter)"/>
    <circle cx="1020" cy="240" r="140" fill="url(#glowGrad)" filter="url(#blurFilter)"/>
    <circle cx="600" cy="170" r="100" fill="url(#glowGrad)" filter="url(#blurFilter)"/>
  </g>

  <!-- Dynamic Circuit / Streaming Streams (Behind text) -->
  <g opacity="0.3" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path class="stream-line" d="M 0,100 Q 300,40 600,100 T 1200,60"/>
    <path class="stream-line" d="M 0,240 Q 350,290 700,220 T 1200,250" stroke="#a855f7"/>
  </g>

  <!-- Foreground Title and Content -->
  <g>
    <!-- Top Meta Tag -->
    <rect x="445" y="32" width="310" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="462" cy="46" r="4" fill="#10b981"/>
    <text x="475" y="50" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1">CURATED DEVELOPER ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="115" class="title" text-anchor="middle" fill="url(#titleGrad)">Awesome Multi-Model Coding Subscriptions</text>

    <!-- Subtitle -->
    <text x="600" y="152" class="subtitle" text-anchor="middle">Flat-Rate Subscriptions • Model Unification • Agent Gateways • Open-Source Routers</text>

    <!-- Floating Dynamic Badges / Model Badges (Safe area below text) -->
    <g class="floating-card-1" transform="translate(180, 200)">
      <!-- Pill 1: Claude 3.7 -->
      <rect x="0" y="0" width="170" height="42" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.95"/>
      <text x="85" y="26" class="badge-text" text-anchor="middle">⚡ Claude 3.7 Sonnet</text>
    </g>

    <g class="floating-card-2" transform="translate(370, 200)">
      <!-- Pill 2: GPT-4o / o3-mini -->
      <rect x="0" y="0" width="160" height="42" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" opacity="0.95"/>
      <text x="80" y="26" class="badge-text" text-anchor="middle">🧠 OpenAI o3 &amp; GPT-5</text>
    </g>

    <g class="floating-card-1" transform="translate(550, 200)">
      <!-- Pill 3: DeepSeek R1 -->
      <rect x="0" y="0" width="160" height="42" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" opacity="0.95"/>
      <text x="80" y="26" class="badge-text" text-anchor="middle">🚀 DeepSeek R1 / V3</text>
    </g>

    <g class="floating-card-2" transform="translate(730, 200)">
      <!-- Pill 4: Gemini Pro -->
      <rect x="0" y="0" width="150" height="42" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" opacity="0.95"/>
      <text x="75" y="26" class="badge-text" text-anchor="middle">✨ Gemini 2.5 Pro</text>
    </g>

    <g class="floating-card-1" transform="translate(900, 200)">
      <!-- Pill 5: Local Ollama -->
      <rect x="0" y="0" width="140" height="42" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.95"/>
      <text x="70" y="26" class="badge-text" text-anchor="middle">💻 Local &amp; Ollama</text>
    </g>

    <!-- Bottom Highlights -->
    <text x="600" y="295" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">
      🛡️ Zero Rate-Limit Anxiety • 🌐 Unified BYOK Gateways • 🔄 Intelligent Fallback Routing • 📉 70%+ Token Compression
    </text>
  </g>
</svg>
